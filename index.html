<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet261 Aviator Predictor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="brand">BET261 PREDICTOR</div>
    <div class="server-status">Serveur : <span class="online">Connecté (API Bet261)</span></div>
    
    <div class="input-group">
      <input type="text" id="user-id" placeholder="Entrez votre ID Joueur Bet261...">
    </div>

    <div class="prediction-box">
      <div class="label">PROCHAIN MULTIPLICATEUR</div>
      <span id="multiplier">1.00x</span>
    </div>

    <button id="predict-btn" onclick="startPrediction()">OBTENIR LE SIGNAL</button>
    <div class="status" id="status">Prêt pour l'analyse</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
